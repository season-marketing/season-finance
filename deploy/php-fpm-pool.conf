[seasonfinance]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-seasonfinance.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500

; Kill any worker stuck longer than this, no matter what the app sets.
; Must stay above the larger of api.php's CURLOPT_TIMEOUT (120s) and
; leads.php's max_execution_time (300s) - otherwise FPM kills the request
; before either of those ever gets a chance to return a clean response,
; which turns a slow-but-legitimate call into a raw 502 instead of a normal
; timeout (this exact bug hit usa-ping - see its deploy/php-fpm-pool.conf).
; Must also match nginx's fastcgi_read_timeout in nginx-seasonfinance.conf.
request_terminate_timeout = 315s
