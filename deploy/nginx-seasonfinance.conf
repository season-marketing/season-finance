# Real site config for seasonfinance.com.
# Copy into place with:
#   sudo cp deploy/nginx-seasonfinance.conf /etc/nginx/sites-available/seasonfinance.com
#   sudo ln -sf /etc/nginx/sites-available/seasonfinance.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Translates the routes from .htaccess (Apache) into nginx, since nginx does
# not read .htaccess files. Unlike usa-ping (pure API backend), this is a
# full site: index.php always renders the same Blade view regardless of
# path (see index.php - no internal routing), everything else is either a
# literal static asset or one of the API endpoints below.
#
# Self-contained on purpose, including the 443/SSL block with hardcoded
# Let's Encrypt paths - see usa-ping's deploy/nginx-usa-ping.conf comment for
# why (letting certbot own this file caused a real HTTPS outage there on
# every later redeploy). First-time SSL setup only needs to *obtain* the
# cert: `sudo certbot certonly --nginx -d seasonfinance.com --non-interactive
# --agree-tos -m <email>`. Do not use plain `certbot --nginx` (no `certonly`)
# here.

upstream php_seasonfinance {
    server unix:/run/php/php8.3-fpm-seasonfinance.sock;
}

server {
    listen 80;
    server_name seasonfinance.com www.seasonfinance.com;

    location /.well-known/acme-challenge/ {
        root /var/www/seasonfinance;
    }

    location / {
        return 301 https://seasonfinance.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name seasonfinance.com www.seasonfinance.com;

    ssl_certificate     /etc/letsencrypt/live/seasonfinance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seasonfinance.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # www redirects to the bare domain, matching the bare-domain cert above
    if ($host = www.seasonfinance.com) {
        return 301 https://seasonfinance.com$request_uri;
    }

    root /var/www/seasonfinance;
    index index.php;

    client_max_body_size 2m;

    # --- API route map, equivalent to the RewriteRule lines in .htaccess ----
    rewrite ^/leads$              /leads.php               last;
    rewrite ^/api/lead$           /leads.php               last;
    rewrite ^/api/application$    /application.php         last;
    rewrite ^/api/status$         /status.php               last;
    rewrite ^/api/debt$           /debt.php                 last;
    rewrite ^/api/user$           /user.php                 last;
    rewrite ^/api/visit$          /visit.php                last;
    rewrite ^/api/affiliate$      /affiliate.php            last;
    rewrite ^/api/customer$       /customer.php             last;
    rewrite ^/api/postback$       /postback.php             last;
    rewrite ^/update/lead         /update_application.php   last;
    rewrite ^/processing$         /processing.php           last;
    rewrite ^/tracking\.js$       /tracking.php             last;

    # Never serve vendor/ or the Blade PHP source directly - only via
    # autoload from index.php. app/Resources/ (images/css/js) stays public.
    location ^~ /vendor/ {
        deny all;
    }
    location ^~ /app/Blade/ {
        deny all;
    }
    location ~ /\.(ht|git|env) {
        deny all;
    }
    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|webpack\.mix\.js|tailwind\.config\.js)$ {
        deny all;
    }

    # Matches actual current behavior: only "/" (via `index` above) and
    # "/index.php" render the Blade homepage. Everything else not matched by
    # an API rewrite or a real static file 404s - the equivalent lines in
    # .htaccess (`RewriteCond ... !-f` / `!-d`) have no RewriteRule after
    # them, so Apache doesn't actually SPA-fallback to index.php today
    # either, despite looking like it's building up to one.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php_seasonfinance;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Must match the FPM pool's request_terminate_timeout (315s, staying
        # above the larger of api.php's 120s curl timeout and leads.php's
        # 300s max_execution_time - both fixed from the original zero-
        # timeout bug). If this is shorter, nginx cuts the connection to PHP
        # before FPM's own limit ever applies.
        fastcgi_read_timeout 315s;
    }

    # Any error nginx itself generates (PHP-FPM unreachable, upstream
    # timeout) should be somewhat readable, not nginx's bare default page.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 503 '<html><body><h1>Temporarily unavailable</h1><p>Please try again shortly.</p></body></html>';
    }
}
