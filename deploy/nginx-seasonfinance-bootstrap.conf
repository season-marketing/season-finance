# Temporary HTTP-only config used ONLY during initial bootstrap, before a
# certificate exists. nginx-seasonfinance.conf's 443 block references
# /etc/letsencrypt/live/seasonfinance.com/... paths that don't exist yet on
# a brand-new instance - applying that file directly during bootstrap makes
# `nginx -t` fail, which (combined with `set -e`) aborts bootstrap.sh before
# nginx ever reloads, silently leaving the stock "Welcome to nginx!" default
# page live. This file has the same real routing, just no SSL block, so the
# site actually works over HTTP immediately. Step 6 in DEPLOY.md (SSL)
# swaps this out for the real nginx-seasonfinance.conf once a cert exists.

upstream php_seasonfinance {
    server unix:/run/php/php8.3-fpm-seasonfinance.sock;
}

server {
    listen 80;
    server_name seasonfinance.com www.seasonfinance.com;

    root /var/www/seasonfinance;
    index index.php;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/seasonfinance;
    }

    # --- API route map, equivalent to the RewriteRule lines in .htaccess ----
    rewrite ^/leads$              /leads.php               last;
    rewrite ^/api/lead$           /leads.php               last;
    rewrite ^/api/application$    /application.php         last;
    rewrite ^/api/status$         /status.php               last;
    rewrite ^/api/debt$           /debt.php                 last;
    rewrite ^/api/user$           /user.php                 last;
    rewrite ^/api/visit$          /visit.php                last;
    rewrite ^/api/affiliate$      /affiliate.php            last;
    rewrite ^/api/customer$       /customer.php             last;
    rewrite ^/api/postback$       /postback.php             last;
    rewrite ^/update/lead         /update_application.php   last;
    rewrite ^/processing$         /processing.php           last;
    rewrite ^/tracking\.js$       /tracking.php             last;

    location ^~ /vendor/ {
        deny all;
    }
    location ^~ /app/Blade/ {
        deny all;
    }
    location ~ /\.(ht|git|env) {
        deny all;
    }
    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|webpack\.mix\.js|tailwind\.config\.js)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php_seasonfinance;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 315s;
    }
}
